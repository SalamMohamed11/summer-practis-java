<!-- index.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home Page</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:insert="navbar.html :: navbar"></div>

<div class="text-box container py-5">
    <h1 class="text-center mb-5">Spring Boot Quiz App</h1>
    <form class="card bg-dark text-white p-4 mx-auto" style="max-width: 500px;" action="/quiz" method="POST">
        <p>Enter Your Name</p>
        <input type="text" name="username" class="form-control mb-3" />
        <p class="text-danger" th:if="${warning}" th:text="${warning}"></p>
        <button type="submit" class="btn btn-warning">Start Quiz</button>
    </form>
</div>

<div th:insert="footer.html :: footer"></div>
<div th:insert="~{navbar :: navbar}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
