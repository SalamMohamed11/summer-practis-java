
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quiz Page</title>
    <link rel="stylesheet" th:href="@{/css/quiz.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:insert="navbar.html :: navbar"></div>

<div class="container py-5">
    <h2 class="text-center mb-4 text-danger">Answer All Questions</h2>

    <form th:object="${qForm}" action="/submit" method="POST">
        <div th:each="ques, i : ${qForm.questions}" class="mb-4 p-3 bg-dark text-white rounded">
            <p class="fw-bold" th:text="${ques.title}"></p>

            <div class="form-check">
                <input class="form-check-input" type="radio" th:name="|questions[${i.index}].chose|" th:value="1">
                <label class="form-check-label" th:text="${ques.optionA}"></label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" th:name="|questions[${i.index}].chose|" th:value="2">
                <label class="form-check-label" th:text="${ques.optionB}"></label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" th:name="|questions[${i.index}].chose|" th:value="3">
                <label class="form-check-label" th:text="${ques.optionC}"></label>
            </div>


            <input type="hidden" th:name="|questions[${i.index}].quesId|" th:value="${ques.quesId}" />
            <input type="hidden" th:name="|questions[${i.index}].title|" th:value="${ques.title}" />
            <input type="hidden" th:name="|questions[${i.index}].ans|" th:value="${ques.ans}" />
        </div>

        <button class="btn btn-danger d-block mx-auto mt-4">Submit Quiz</button>
    </form>
</div>

<div th:insert="footer.html :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
